syntax = "proto3";

package prowl;

option go_package = "github.com/heywinit/prowl/pkg/proto";

message AgentSync {
  string token = 1;
  string agent_version = 2;
  string host_id = 3;
  HostInfo host_info = 4;
}

message ServerAck {
  bool accepted = 1;
  string message = 2;
}

message Ping {
  int64 timestamp_ms = 1;
}

message Pong {
  int64 timestamp_ms = 1;
}

message HostInfo {
  string os = 1;
  string architecture = 2;
  string docker_version = 3;
  int64 total_memory_bytes = 4;
  int32 cpu_count = 5;
  repeated string available_disk_paths = 6;
}
